<!DOCTYPE html>
<html>
<head>
    <title>Food Image Map</title>
</head>
<body>
    <h2>Food Image Map</h2>
    <p>Click on a food image to see its details.</p>

    <p><b>Pizza</b></p>
    <img src="pizza.jpg" usemap="#foodmap1" width="300" alt="Pizza"><br><br>
    <p><b>Burger</b></p>
    <img src="burger.jpg" usemap="#foodmap2" width="300" alt="Burger"><br><br>
    <p><b>Sandwich</b></p>
    <img src="sandwich.jpg" usemap="#foodmap3" width="300" alt="Sandwich"><br><br>
    <p><b>Ice Cream</b></p>
    <img src="icecream.jpg" usemap="#foodmap4" width="300" alt="Ice Cream"><br><br>

    <map name="foodmap1">
        <area shape="rect" coords="0,0,736,1104" href="pizza.html" alt="Pizza">
    </map>
    <map name="foodmap2">
        <area shape="rect" coords="0,0,747,350" href="burger.html" alt="Burger">
    </map>
    <map name="foodmap3">
        <area shape="rect" coords="0,0,736,736" href="sandwich.html" alt="Sandwich">
    </map>
    <map name="foodmap4">
        <area shape="rect" coords="0,0,736,1308" href="icecream.html" alt="Ice Cream">
    </map>

    <p><a href="index.html">Back to Practical 4</a></p>
</body>
</html>
