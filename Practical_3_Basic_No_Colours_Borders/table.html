<!DOCTYPE html>
<html>
<head>
    <title>Table</title>
</head>
<body>
    <center>
    <h2>My Food Menu</h2>

    <table border="1" width="75%" height="300" cellpadding="12" cellspacing="4">
        <tr>
            <th rowspan="2">Day</th>
            <th colspan="3">Food</th>
        </tr>
        <tr>
            <th>Breakfast</th>
            <th>Lunch</th>
            <th>Dinner</th>
        </tr>
        <tr>
            <td rowspan="2">Monday</td>
            <td>Sandwich</td>
            <td>Rice</td>
            <td>Pizza</td>
        </tr>
        <tr>
            <td colspan="2">Burger and Fries</td>
            <td>Ice Cream</td>
        </tr>
        <tr>
            <td>Tuesday</td>
            <td>Paratha</td>
            <td colspan="2">Chole Bhature</td>
        </tr>
    </table>

    <p><a href="index.html">Back to Practical 3</a></p>
</center>
</body>
</html>
