<!DOCTYPE html>
<html>
<head>
    <title>Food Image Map</title>
</head>
<body>
    <h2>Food Image Map</h2>

    <p>Click on a food item to see its details.</p>

    <img src="food_menu.png" usemap="#foodmap"
         width="900" height="500" alt="Food Menu">

    <map name="foodmap">
        <area shape="rect" coords="90,105,310,300"
              href="pizza.html" alt="Pizza">

        <area shape="rect" coords="500,115,730,285"
              href="burger.html" alt="Burger">

        <area shape="rect" coords="100,350,330,490"
              href="sandwich.html" alt="Sandwich">

        <area shape="rect" coords="555,350,685,490"
              href="icecream.html" alt="Ice Cream">
    </map>

    <p><a href="index.html">Back to Practical 4</a></p>
</body>
</html>
